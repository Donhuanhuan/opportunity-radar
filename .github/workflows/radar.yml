name: 商机雷达

on:
  # 每天北京时间 9:00 跑一次（UTC 1:00）
  schedule:
    - cron: '0 1 * * *'
  # 允许手动触发（调试用）
  workflow_dispatch:
    inputs:
      source:
        description: '指定信号源（留空跑全部）'
        required: false
        default: ''
      dry_run:
        description: '是否仅抓取不推送（false=真实推送到飞书）'
        required: false
        default: 'false'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⏬ 检出代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔭 执行扫描 (M1)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 多维表格 · 商机池
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
          # 多维表格 · 内容草稿（M2 用）
          DRAFTS_BITABLE_APP_TOKEN: ${{ secrets.DRAFTS_BITABLE_APP_TOKEN }}
          DRAFTS_BITABLE_TABLE_ID: ${{ secrets.DRAFTS_BITABLE_TABLE_ID }}
          # LLM（M2 用，按性价比推荐 DeepSeek）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # M2 处理条数（默认 3，控制 LLM 成本）
          M2_TOP_N: ${{ vars.M2_TOP_N || '3' }}
          # 同时推送飞书群卡片 + 写入多维表格
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'feishu,feishu_bitable' }}
          # 内容方向：国内情绪热点三件套（微博/知乎/头条），海外技术源仅手动触发时用
          RADAR_SOURCES: ${{ github.event.inputs.source || 'weibo,zhihu_hot,toutiao' }}
          # 目标内容平台：策略调整后默认仅做知乎（小红书另有他用，不自动化）
          RADAR_PLATFORMS: ${{ vars.RADAR_PLATFORMS || 'zhihu' }}
        run: |
          # 空结果不再算失败；这里若传 dry_run=true 则只打印不推送
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            echo "🔕 测试模式（dry-run）：只抓取，不推送"
            python -m radar.scan --dry-run
          else
            echo "📨 正式模式：扫描后推送飞书（notify channels: $NOTIFY_CHANNELS）"
            python -m radar.scan
          fi

      - name: 🧠 M2 内容工厂（4-Agent：选题→排版→风控→质检QC→写审核表=待审）
        if: github.event.inputs.dry_run != 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          # 内容审核表（M3 发布闸，供欢欢人工点「通过」）
          FEISHU_AUDIT_APP_TOKEN: ${{ secrets.FEISHU_AUDIT_APP_TOKEN }}
          FEISHU_AUDIT_TABLE_ID: ${{ secrets.FEISHU_AUDIT_TABLE_ID }}
          # LLM（按性价比自动 DeepSeek → Claude → OpenAI）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 每天最多生成条数（默认 3，控 LLM 成本）
          M2_TOP_N: ${{ vars.M2_TOP_N || '3' }}
          # 目标内容平台：与上面 RADAR_PLATFORMS 保持一致，避免云端变量不一致
          RADAR_PLATFORMS: ${{ vars.RADAR_PLATFORMS || 'zhihu' }}
          # 质检闸：及格线 75，不达标自动重写一次，仍不达标标拒绝拦截
          QC_ENABLED: ${{ vars.QC_ENABLED || 'on' }}
          QC_MIN_SCORE: ${{ vars.QC_MIN_SCORE || '75' }}
        run: |
          echo "🧠 4-Agent 内容工厂：把 M1 刚落盘的 opportunities.jsonl 生成待审草稿（含质检闸）"
          python -m agents.orchestrator --limit ${M2_TOP_N}
          # 把当日商机作为 artifact 上传（审核表记录已含全部内容）
          mkdir -p artifacts
          cp -f data/opportunities.jsonl artifacts/opportunities-$(date -u +%Y%m%dT%H%M%SZ).jsonl 2>/dev/null || true
          cp -f data/agent_cost.jsonl artifacts/agent_cost-$(date -u +%Y%m%dT%H%M%SZ).jsonl 2>/dev/null || true

      - name: 📤 上传当日商机产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunities-jsonl
          path: data/opportunities.jsonl
          if-no-files-found: ignore

      - name: 🏁 完成上报
        if: always()
        run: |
          echo "✅ 商机雷达(M1 国内情绪热点) + 内容工厂(4-Agent · 平台=${RADAR_PLATFORMS}) 已完成 · $(date -Iseconds)"