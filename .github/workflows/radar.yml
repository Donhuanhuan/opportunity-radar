name: 商机雷达

on:
  # 每天北京时间 9:00 跑一次（UTC 1:00）
  schedule:
    - cron: '0 1 * * *'
  # 允许手动触发（调试用）
  workflow_dispatch:
    inputs:
      source:
        description: '指定信号源（留空跑全部）'
        required: false
        default: ''
      dry_run:
        description: '是否仅抓取不推送（false=真实推送到飞书）'
        required: false
        default: 'false'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⏬ 检出代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔭 执行扫描
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RADAR_SOURCES: ${{ github.event.inputs.source || 'hackernews,github_trending,producthunt,kr36,weibo' }}
        run: |
          # 空结果不再算失败；这里若传 dry_run=true 则只打印不推送
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            echo "🔕 测试模式（dry-run）：只抓取，不推送"
            python -m radar.scan --dry-run
          else
            echo "📨 正式模式：扫描后推送飞书"
            python -m radar.scan
          fi

      - name: 🏁 完成上报
        if: always()
        run: |
          echo "✅ 商机雷达扫描完成 · $(date -Iseconds)"