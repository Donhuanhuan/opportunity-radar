name: 商机雷达

on:
  # 每天北京时间 9:00 跑一次（UTC 1:00）
  schedule:
    - cron: '0 1 * * *'
  # 允许手动触发（调试用）
  workflow_dispatch:
    inputs:
      source:
        description: '指定信号源（留空跑全部）'
        required: false
        default: ''
      dry_run:
        description: '是否仅抓取不推送（false=真实推送到飞书）'
        required: false
        default: 'false'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⏬ 检出代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔭 执行扫描 (M1)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 多维表格 · 商机池
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
          # 多维表格 · 内容草稿（M2 用）
          DRAFTS_BITABLE_APP_TOKEN: ${{ secrets.DRAFTS_BITABLE_APP_TOKEN }}
          DRAFTS_BITABLE_TABLE_ID: ${{ secrets.DRAFTS_BITABLE_TABLE_ID }}
          # LLM（M2 用，按性价比推荐 DeepSeek）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # M2 处理条数（默认 3，控制 LLM 成本）
          M2_TOP_N: ${{ vars.M2_TOP_N || '3' }}
          # 同时推送飞书群卡片 + 写入多维表格
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'feishu,feishu_bitable' }}
          RADAR_SOURCES: ${{ github.event.inputs.source || 'hackernews,github_trending,producthunt,kr36,weibo' }}
        run: |
          # 空结果不再算失败；这里若传 dry_run=true 则只打印不推送
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            echo "🔕 测试模式（dry-run）：只抓取，不推送"
            python -m radar.scan --dry-run
          else
            echo "📨 正式模式：扫描后推送飞书（notify channels: $NOTIFY_CHANNELS）"
            python -m radar.scan
          fi

      - name: 🧠 M2 内容工厂
        if: github.event.inputs.dry_run != 'true'
        env:
          # 内容草稿表
          DRAFTS_BITABLE_APP_TOKEN: ${{ secrets.DRAFTS_BITABLE_APP_TOKEN }}
          DRAFTS_BITABLE_TABLE_ID: ${{ secrets.DRAFTS_BITABLE_TABLE_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          # LLM
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          M2_TOP_N: ${{ vars.M2_TOP_N || '3' }}
        run: |
          echo "🧠 M2 内容工厂：把今日 Top ${M2_TOP_N} 商机生成小红书+知乎双版本文案"
          # 从商机池取最新 ${M2_TOP_N} 条 (token 复用)
          python <<'PYEOF'
          import json, os, sys, urllib.request
          APP_TOKEN = os.environ.get("FEISHU_BITABLE_APP_TOKEN", "")
          TABLE_ID  = os.environ.get("FEISHU_BITABLE_TABLE_ID", "")
          APP_ID    = os.environ.get("FEISHU_APP_ID", "")
          SECRET    = os.environ.get("FEISHU_APP_SECRET", "")
          M2_TOP    = int(os.environ.get("M2_TOP_N", "3"))
          if not all([APP_TOKEN, TABLE_ID, APP_ID, SECRET]):
              print("⚠️ 商机池表配置不全，M2 跳过")
              sys.exit(0)
          # 拿 token
          req = urllib.request.Request(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              data=json.dumps({"app_id": APP_ID, "app_secret": SECRET}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          token = json.load(urllib.request.urlopen(req))["tenant_access_token"]
          # 拉今日记录（按 date desc 排）
          url = (f"https://open.feishu.cn/open-apis/bitable/v1/apps/{APP_TOKEN}/tables/{TABLE_ID}/records"
                 f"?sort=date%20DESC&page_size={max(M2_TOP*2, 10)}")
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          data = json.load(urllib.request.urlopen(req))
          items = []
          for rec in data.get("data", {}).get("items", []):
              f = rec.get("fields", {})
              items.append({
                  "title":   f.get("title") or f.get("文本") or "",
                  "url":     (f.get("url") or {}).get("link") if isinstance(f.get("url"), dict) else "",
                  "source":  f.get("source", ""),
                  "score":   int(f.get("score", 0) or 0),
                  "summary": f.get("summary", ""),
                  "tags":    f.get("tags", []) or [],
              })
              if len(items) >= M2_TOP:
                  break
          if not items:
              print("⚠️ 商机池今日无记录，M2 跳过")
              sys.exit(0)
          print(f"📥 从商机池拉了 {len(items)} 条：")
          for it in items:
              print(f"  - {it['title'][:60]}  (score={it['score']})")
          # 写到文件，给 m2_pipeline 吃
          with open("/tmp/m2_items.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False)
          PYEOF
          # 跑 m2_pipeline
          python -m radar.m2_pipeline --items-file /tmp/m2_items.json --top ${M2_TOP_N}
          # 把 JSONL 草稿作为 artifact 上传
          mkdir -p artifacts
          cp -f data/drafts.jsonl artifacts/drafts-$(date -u +%Y%m%dT%H%M%SZ).jsonl 2>/dev/null || true

      - name: 📤 上传草稿产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drafts-jsonl
          path: data/drafts.jsonl
          if-no-files-found: ignore

      - name: 🏁 完成上报
        if: always()
        run: |
          echo "✅ 商机雷达 + 内容工厂 已完成 · $(date -Iseconds)"